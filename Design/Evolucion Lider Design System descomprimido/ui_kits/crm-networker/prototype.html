<!-- @dsCard group="CRM Networker" viewport="480x860" name="Prototipo navegable" subtitle="Login → Registro → app completa, con selector móvil / escritorio" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Evolución Líder · Prototipo</title>
<link rel="stylesheet" href="../../styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin:0; height:100%; background:var(--color-neutral-200); font-family:'Inter',sans-serif; }
  #root { min-height:100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="../crm-networker-desktop/app.jsx"></script>
<script type="text/babel">
const { PhoneFrame, StatusBar, ScreenHeader, TabBar, Fab, Login, Registro, AuthBrand, AuthField, PasswordField } = window;
const SCREEN_TITLE = { home:'Actividad Diaria', pipe:'Prospectos', resumen:'Resumen' };

function useNSReady() {
  const [ready, setReady] = React.useState(!!window.EvoluciNLDerDesignSystem_8c407a);
  React.useEffect(() => {
    if (ready) return;
    const t = setInterval(() => { if (window.EvoluciNLDerDesignSystem_8c407a) { setReady(true); clearInterval(t); } }, 40);
    return () => clearInterval(t);
  }, [ready]);
  return ready;
}

function PLinkText({ children, onClick }) {
  return <button type="button" onClick={onClick} style={{ all:'unset', cursor:'pointer', color:'var(--color-primary-600)', fontWeight:600 }}>{children}</button>;
}

function MobileToast({ msg }) {
  if (!msg) return null;
  return <div style={{ position:'absolute', left:16, right:16, bottom:84, zIndex:40, background:'var(--color-neutral-900)', color:'#fff', borderRadius:'var(--radius-md)', padding:'12px 16px', fontSize:14, fontWeight:500, boxShadow:'var(--shadow-3)', animation:'el-fade-in var(--duration-base) ease' }}>{msg}</div>;
}

// ── Desktop auth — centered card (no sidebar, no tab bar) ────────────
function DesktopLogin({ onSubmit, onGoRegister }) {
  const { Icon, Button } = window.EvoluciNLDerDesignSystem_8c407a;
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [error, setError] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const submit = () => {
    setLoading(true);
    setTimeout(() => { setLoading(false); if (email.includes('hola')) onSubmit(); else setError(true); }, 700);
  };
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--surface-app)', fontFamily:'var(--font-sans)' }}>
      <div style={{ width:400, boxSizing:'border-box', background:'var(--surface-card)', border:'1px solid var(--border-default)', borderRadius:'var(--radius-lg)', boxShadow:'var(--shadow-2)', padding:'40px 36px' }}>
        <AuthBrand subtitle="Inicia sesión en tu CRM" />
        {error && (
          <div style={{ display:'flex', alignItems:'center', gap:8, background:'var(--color-error-bg)', border:'1px solid #FECACA', borderRadius:'var(--radius-md)', padding:'10px 12px', marginBottom:16 }}>
            <Icon name="alert-circle" size={16} color="var(--color-error-text)" />
            <span style={{ fontSize:13, color:'var(--color-error-text)', fontWeight:500 }}>Email o contraseña incorrectos</span>
          </div>
        )}
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <AuthField label="Email" type="email" value={email} onChange={e => { setEmail(e.target.value); setError(false); }} placeholder="tucorreo@ejemplo.com" autoComplete="email" error={error ? ' ' : ''} />
          <div>
            <PasswordField value={pass} onChange={e => { setPass(e.target.value); setError(false); }} error={error ? ' ' : ''} />
            <div style={{ textAlign:'right', marginTop:8, fontSize:13 }}><PLinkText>¿Olvidaste tu contraseña?</PLinkText></div>
          </div>
          <Button variant="primary" size="lg" fullWidth loading={loading} onClick={submit}>Iniciar sesión</Button>
        </div>
        <div style={{ textAlign:'center', marginTop:24, fontSize:14, color:'var(--color-neutral-500)' }}>¿No tienes cuenta? <PLinkText onClick={onGoRegister}>Regístrate</PLinkText></div>
      </div>
    </div>
  );
}

function DesktopRegistro({ onSubmit, onGoLogin }) {
  const { Button } = window.EvoluciNLDerDesignSystem_8c407a;
  const [name, setName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [errors, setErrors] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const submit = () => {
    const e = {};
    if (!name.trim()) e.name = 'El nombre es obligatorio';
    if (!email.trim()) e.email = 'El email es obligatorio';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e.email = 'Introduce un email válido';
    if (!pass) e.pass = 'La contraseña es obligatoria';
    else if (pass.length < 6) e.pass = 'Mínimo 6 caracteres';
    setErrors(e);
    if (Object.keys(e).length === 0) { setLoading(true); setTimeout(() => { setLoading(false); onSubmit(); }, 700); }
  };
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--surface-app)', fontFamily:'var(--font-sans)' }}>
      <div style={{ width:400, boxSizing:'border-box', background:'var(--surface-card)', border:'1px solid var(--border-default)', borderRadius:'var(--radius-lg)', boxShadow:'var(--shadow-2)', padding:'40px 36px' }}>
        <AuthBrand subtitle="Crea tu cuenta gratis" />
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <AuthField label="Nombre" value={name} onChange={e => { setName(e.target.value); setErrors(p => ({ ...p, name:'' })); }} placeholder="Nombre y apellidos" autoComplete="name" error={errors.name} />
          <AuthField label="Email" type="email" value={email} onChange={e => { setEmail(e.target.value); setErrors(p => ({ ...p, email:'' })); }} placeholder="tucorreo@ejemplo.com" autoComplete="email" error={errors.email} />
          <PasswordField label="Contraseña" placeholder="Crea una contraseña" value={pass} onChange={e => { setPass(e.target.value); setErrors(p => ({ ...p, pass:'' })); }} error={errors.pass} />
          <Button variant="primary" size="lg" fullWidth loading={loading} onClick={submit}>Crear cuenta</Button>
        </div>
        <div style={{ textAlign:'center', marginTop:24, fontSize:14, color:'var(--color-neutral-500)' }}>¿Ya tienes cuenta? <PLinkText onClick={onGoLogin}>Inicia sesión</PLinkText></div>
      </div>
    </div>
  );
}

// ── Mobile app (full data, tabs, ficha, account menu) ─────────────────
function MobileApp({ onLogout }) {
  const NS = window.EvoluciNLDerDesignSystem_8c407a;
  const { Icon } = NS;
  const [tab, setTab] = React.useState('home');
  const [ficha, setFicha] = React.useState(null);
  const [sheet, setSheet] = React.useState(false);
  const [account, setAccount] = React.useState(false);
  const [toast, setToast] = React.useState('');
  const fire = (m) => { setToast(m); clearTimeout(window.__protoT); window.__protoT = setTimeout(() => setToast(''), 1800); };
  const isRoot = !ficha;
  return (
    <PhoneFrame>
      <StatusBar />
      {ficha
        ? <ScreenHeader title="Ficha del prospecto" onBack={() => setFicha(null)} action={<button style={{ all:'unset', cursor:'pointer', padding:6 }}><Icon name="more-vertical" size={20} color="var(--color-neutral-500)" /></button>} />
        : <ScreenHeader title={SCREEN_TITLE[tab]} action={<window.AccountButton onClick={() => setAccount(true)} />} />}
      {ficha ? <window.Ficha prospect={ficha} onAction={fire} />
        : tab === 'home' ? <window.ActividadDiaria onOpen={setFicha} onAction={fire} />
        : tab === 'pipe' ? <window.Pipeline onOpen={setFicha} onAction={fire} />
        : <window.Resumen />}
      {isRoot && <Fab onClick={() => setSheet(true)} />}
      {isRoot && <TabBar active={tab} onChange={setTab} />}
      {sheet && <window.NuevoProspecto onClose={() => setSheet(false)} onSave={(n) => { setSheet(false); fire(n + ' añadido'); }} />}
      {account && <window.AccountSheet onClose={() => setAccount(false)} onLogout={() => { setAccount(false); onLogout(); }} />}
      <MobileToast msg={toast} />
    </PhoneFrame>
  );
}

// ── Platform switcher — fixed, reuses FilterChip ──────────────────────
function PlatformSwitcher({ platform, onChange }) {
  const { FilterChip } = window.EvoluciNLDerDesignSystem_8c407a;
  return (
    <div style={{ position:'fixed', top:16, right:16, zIndex:100, display:'flex', gap:8, background:'#fff', padding:6, borderRadius:'var(--radius-full)', boxShadow:'var(--shadow-2)', border:'1px solid var(--border-default)' }}>
      <FilterChip active={platform === 'mobile'} onClick={() => onChange('mobile')}>Móvil</FilterChip>
      <FilterChip active={platform === 'desktop'} onClick={() => onChange('desktop')}>Escritorio</FilterChip>
    </div>
  );
}

// ── Orchestrator ───────────────────────────────────────────────────────
function Prototype() {
  const ready = useNSReady();
  const [platform, setPlatform] = React.useState('mobile');
  const [view, setView] = React.useState('login'); // login | registro | app
  if (!ready) return null;

  const goApp = () => setView('app');
  const goLogin = () => setView('login');
  const goRegistro = () => setView('registro');

  let content;
  if (platform === 'mobile') {
    if (view === 'login') content = <PhoneFrame><StatusBar /><Login onGoRegister={goRegistro} onSubmit={goApp} onForgot={() => {}} /></PhoneFrame>;
    else if (view === 'registro') content = <PhoneFrame><StatusBar /><Registro onGoLogin={goLogin} onSubmit={goApp} /></PhoneFrame>;
    else content = <MobileApp onLogout={goLogin} />;
  } else {
    if (view === 'login') content = <DesktopLogin onGoRegister={goRegistro} onSubmit={goApp} />;
    else if (view === 'registro') content = <DesktopRegistro onGoLogin={goLogin} onSubmit={goApp} />;
    else content = <window.CrmDesktop onLogout={goLogin} />;
  }

  return (
    <React.Fragment>
      <PlatformSwitcher platform={platform} onChange={setPlatform} />
      {content}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Prototype />);
</script>
</body>
</html>
