<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin:0; padding:24px; background:#fff; font-family:'Inter',sans-serif; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Switch } = window.EvoluciNLDerDesignSystem_8c407a;
  function Demo() {
    const [stage, setStage] = React.useState('contacted');
    const [on, setOn] = React.useState(true);
    return (
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, maxWidth:640 }}>
        <Input label="Nombre" defaultValue="María Fernández" />
        <Input label="Email" error="Introduce un email válido" defaultValue="maria@" />
        <Select label="Etapa" value={stage} onChange={setStage}
          options={[{value:'new',label:'Nuevo'},{value:'contacted',label:'Contactado'},{value:'presented',label:'Presentación realizada'},{value:'joined',label:'Incorporado'}]} />
        <div style={{ display:'flex', alignItems:'flex-end' }}>
          <Switch checked={on} onChange={setOn} label="Recordatorio de seguimiento" />
        </div>
        <div style={{ gridColumn:'1 / -1' }}>
          <Input label="Notas" multiline rows={3} placeholder="Añade una nota sobre la última conversación…" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
