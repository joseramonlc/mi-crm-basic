<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin:0; padding:24px; background:var(--color-neutral-100); font-family:'Inter',sans-serif; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { ProspectCard, FilterChip, EmptyState, CountBadge, Icon } = window.EvoluciNLDerDesignSystem_8c407a;
  function Demo() {
    const [active, setActive] = React.useState('all');
    const chips = [['all','Todos'],['high','Alta prioridad'],['contacted','Contactado'],['new','Nuevos']];
    return (
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, alignItems:'start' }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
            <div style={{ display:'flex', gap:8, overflow:'hidden', flex:1 }}>
              {chips.map(([k,l]) => <FilterChip key={k} active={active===k} onClick={()=>setActive(k)}>{l}</FilterChip>)}
            </div>
            <button style={{ position:'relative', width:34, height:34, borderRadius:9999, border:'1px solid var(--border-strong)', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', flex:'none', cursor:'pointer' }}>
              <Icon name="menu" size={18} color="var(--color-neutral-600)" />
              <span style={{ position:'absolute', top:-4, right:-4 }}><CountBadge count={2} /></span>
            </button>
          </div>
          <ProspectCard name="María Fernández" stage="contacted" priority="high" channel="whatsapp" lastInteraction="Último WhatsApp" timeAgo="hace 2 días" />
        </div>
        <EmptyState icon="users" title="Aún no tienes prospectos"
          description="Añade tu primer prospecto para empezar a construir tu red."
          ctaLabel="Añadir prospecto" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
