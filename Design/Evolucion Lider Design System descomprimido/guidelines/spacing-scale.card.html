<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--color-primary-200);border-radius:3px;width:24px;}
  .l{font-size:10px;font-family:ui-monospace,monospace;color:var(--color-neutral-400);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="bar" style="height:var(--space-1)"></div><span class="l">1·4</span></div>
  <div class="item"><div class="bar" style="height:var(--space-2)"></div><span class="l">2·8</span></div>
  <div class="item"><div class="bar" style="height:var(--space-3)"></div><span class="l">3·12</span></div>
  <div class="item"><div class="bar" style="height:var(--space-4)"></div><span class="l">4·16</span></div>
  <div class="item"><div class="bar" style="height:var(--space-5)"></div><span class="l">5·20</span></div>
  <div class="item"><div class="bar" style="height:var(--space-6)"></div><span class="l">6·24</span></div>
  <div class="item"><div class="bar" style="height:var(--space-8)"></div><span class="l">8·32</span></div>
  <div class="item"><div class="bar" style="height:var(--space-10)"></div><span class="l">10·40</span></div>
  <div class="item"><div class="bar" style="height:var(--space-12)"></div><span class="l">12·48</span></div>
  <div class="item"><div class="bar" style="height:var(--space-16)"></div><span class="l">16·64</span></div>
</div>
</body></html>
