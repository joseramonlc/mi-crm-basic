<!-- @dsCard group="Spacing" viewport="700x140" name="Border radius" subtitle="sm 4 · md 8 · lg 12 · xl 16 · full" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:18px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:64px;background:var(--color-primary-50);border:1.5px solid var(--color-primary-300);}
  .l{font-size:11px;font-family:ui-monospace,monospace;color:var(--color-neutral-500);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="l">sm · 4</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="l">md · 8</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="l">lg · 12</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-card)"></div><span class="l">card · 14</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="l">xl · 16</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><span class="l">full</span></div>
</div>
</body></html>
