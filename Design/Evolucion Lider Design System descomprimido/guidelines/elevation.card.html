<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="shadow 0 (flat) · 1 rest · 2 dropdown · 3 modal" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:24px;align-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:96px;height:64px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);}
  .l{font-size:11px;font-family:ui-monospace,monospace;color:var(--color-neutral-500);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-0)"></div><span class="l">0 · flat</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-1)"></div><span class="l">1 · rest</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-2)"></div><span class="l">2 · dropdown</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-3)"></div><span class="l">3 · modal</span></div>
</div>
</body></html>
