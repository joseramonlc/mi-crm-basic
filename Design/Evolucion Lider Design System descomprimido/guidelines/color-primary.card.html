<!-- @dsCard group="Colors" viewport="700x130" name="Primary · Green" subtitle="Action & trust — 50→900, base 500 (#16A34A)" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:'Inter',sans-serif;}
  .ramp{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border-default);}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;}
  .n{font-size:10px;font-weight:600;font-family:ui-monospace,monospace;}
  .h{font-size:9px;font-family:ui-monospace,monospace;opacity:.75;}
</style></head>
<body>
<div class="ramp">
  <div class="sw" style="background:var(--color-primary-50)"><span class="n" style="color:#15803D">50</span></div>
  <div class="sw" style="background:var(--color-primary-100)"><span class="n" style="color:#15803D">100</span></div>
  <div class="sw" style="background:var(--color-primary-200)"><span class="n" style="color:#15803D">200</span></div>
  <div class="sw" style="background:var(--color-primary-300)"><span class="n" style="color:#14532D">300</span></div>
  <div class="sw" style="background:var(--color-primary-400)"><span class="n" style="color:#14532D">400</span></div>
  <div class="sw" style="background:var(--color-primary-500)"><span class="n" style="color:#fff">500</span><span class="h" style="color:#fff">#16A34A</span></div>
  <div class="sw" style="background:var(--color-primary-600)"><span class="n" style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--color-primary-700)"><span class="n" style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--color-primary-800)"><span class="n" style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--color-primary-900)"><span class="n" style="color:#fff">900</span></div>
</div>
</body></html>
