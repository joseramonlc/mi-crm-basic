<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:'Inter',sans-serif;}
  .row{display:flex;gap:10px;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;font-size:13px;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;}
</style></head>
<body>
<div class="row">
  <span class="pill" style="background:var(--color-priority-high-bg);color:var(--color-priority-high-text)"><span class="dot" style="background:var(--color-priority-high-dot)"></span>Alta</span>
  <span class="pill" style="background:var(--color-priority-medium-bg);color:var(--color-priority-medium-text)"><span class="dot" style="background:var(--color-priority-medium-dot)"></span>Media</span>
  <span class="pill" style="background:var(--color-priority-low-bg);color:var(--color-priority-low-text)"><span class="dot" style="background:var(--color-priority-low-dot)"></span>Baja</span>
</div>
</body></html>
