<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px 24px;background:#fff;font-family:var(--font-sans);color:var(--color-neutral-700);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;}
  .do,.dont{font-size:14px;line-height:1.5;}
  .h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
  .do .h{color:var(--color-success-text);} .dont .h{color:var(--color-error-text);}
  .ex{color:var(--color-neutral-900);font-weight:500;}
  .mut{color:var(--color-neutral-400);}
</style></head>
<body>
<div class="grid">
  <div class="do"><div class="h">✓ Hacemos</div>
    <div class="ex">"Añade tu primer prospecto"</div>
    <div class="ex">"Llama a María antes del viernes"</div>
    <div class="mut">Imperativo, de tú, verbos de acción, claro y breve.</div>
  </div>
  <div class="dont"><div class="h">✕ Evitamos</div>
    <div class="ex">"Proceda a la cumplimentación del registro"</div>
    <div class="ex">"¡¡Vamos a por todas 🚀🔥!!"</div>
    <div class="mut">Jerga corporativa, usted, exclamaciones, emoji.</div>
  </div>
</div>
</body></html>
