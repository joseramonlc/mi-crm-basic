<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:36px;align-items:flex-end;}
  .num{font-family:var(--font-numeric);font-feature-settings:var(--num-features);color:var(--color-neutral-900);}
  .cap{font-size:12px;color:var(--color-neutral-400);margin-top:4px;}
</style></head>
<body>
<div class="row">
  <div><div class="num" style="font-size:32px;font-weight:700">128</div><div class="cap">Prospectos · KPI 32/700</div></div>
  <div><div class="num" style="font-size:22px;font-weight:600">1.450 €</div><div class="cap">Importe · 22/600</div></div>
  <div>
    <div class="num" style="font-size:15px;font-weight:500;text-align:right">12.480<br>3.205<br>980</div>
    <div class="cap">Tabla · 15/500 alineadas</div>
  </div>
</div>
</body></html>
