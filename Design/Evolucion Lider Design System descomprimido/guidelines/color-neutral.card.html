<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals · Slate" subtitle="Surfaces, text & borders — white → black" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:'Inter',sans-serif;}
  .ramp{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border-default);}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px;}
  .n{font-size:10px;font-weight:600;font-family:ui-monospace,monospace;}
</style></head>
<body>
<div class="ramp">
  <div class="sw" style="background:var(--color-neutral-white)"><span class="n" style="color:#334155">white</span></div>
  <div class="sw" style="background:var(--color-neutral-50)"><span class="n" style="color:#334155">50</span></div>
  <div class="sw" style="background:var(--color-neutral-100)"><span class="n" style="color:#334155">100</span></div>
  <div class="sw" style="background:var(--color-neutral-200)"><span class="n" style="color:#334155">200</span></div>
  <div class="sw" style="background:var(--color-neutral-300)"><span class="n" style="color:#334155">300</span></div>
  <div class="sw" style="background:var(--color-neutral-400)"><span class="n" style="color:#fff">400</span></div>
  <div class="sw" style="background:var(--color-neutral-500)"><span class="n" style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--color-neutral-600)"><span class="n" style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--color-neutral-700)"><span class="n" style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--color-neutral-800)"><span class="n" style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--color-neutral-900)"><span class="n" style="color:#fff">900</span></div>
  <div class="sw" style="background:var(--color-neutral-black)"><span class="n" style="color:#fff">black</span></div>
</div>
</body></html>
