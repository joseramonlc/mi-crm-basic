<!-- @dsCard group="Colors" viewport="700x140" name="Semantic & Accent" subtitle="Success, warning, error, info + violet accent" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:'Inter',sans-serif;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:110px;border-radius:10px;border:1px solid var(--border-default);overflow:hidden;}
  .bar{height:44px;}
  .meta{padding:8px 10px;}
  .t{font-size:12px;font-weight:600;color:var(--color-neutral-900);}
  .h{font-size:10px;font-family:ui-monospace,monospace;color:var(--color-neutral-400);}
</style></head>
<body>
<div class="row">
  <div class="chip"><div class="bar" style="background:var(--color-success)"></div><div class="meta"><div class="t">Success</div><div class="h">#16A34A</div></div></div>
  <div class="chip"><div class="bar" style="background:var(--color-warning)"></div><div class="meta"><div class="t">Warning</div><div class="h">#F59E0B</div></div></div>
  <div class="chip"><div class="bar" style="background:var(--color-error)"></div><div class="meta"><div class="t">Error</div><div class="h">#EF4444</div></div></div>
  <div class="chip"><div class="bar" style="background:var(--color-info)"></div><div class="meta"><div class="t">Info</div><div class="h">#3B82F6</div></div></div>
  <div class="chip"><div class="bar" style="background:var(--color-accent-500)"></div><div class="meta"><div class="t">Accent</div><div class="h">#7C3AED</div></div></div>
</div>
</body></html>
